<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Gestures Extension</title>
    <!-- Preload critical assets -->
    <link
      rel="preload"
      href="https://cdn.jsdelivr.net/npm/chota@latest/dist/chota.min.css"
      as="style"
    />
    <link rel="preload" href="icon.svg" as="image" />

    <!-- Optimized CSS loading -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/chota@latest/dist/chota.min.css"
    />
    <style>
      /* Optimized CSS with better performance */
      :root {
        --primary-color: #1a73e8;
        --hover-color: #1558b0;
      }

      body {
        background-color: #eef1f6;
        color: #333;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        min-width: 450px;
        min-height: 500px;
        padding: 1rem;
        box-sizing: border-box;
      }

      .container {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 1.5rem;
        display: grid;
        gap: 1rem;
        width: 100%;
        box-sizing: border-box;
      }

      .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 1rem;
        display: block;
      }

      .lead {
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 0.5rem;
      }

      .list {
        margin: 0;
        padding-left: 1.2rem;
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .list li {
        margin-bottom: 0.5rem;
      }

      .button {
        display: inline-block;
        background-color: var(--primary-color);
        color: white;
        padding: 0.6rem 1.2rem;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 500;
        text-align: center;
        transition: background-color 0.2s ease;
        border: none;
        cursor: pointer;
      }

      .button:hover {
        background-color: var(--hover-color);
      }

      footer {
        text-align: center;
        margin-top: auto;
      }

      .settings {
        border-top: 1px solid #eee;
        padding-top: 1rem;
        margin-top: 1rem;
      }

      .settings-group {
        margin-bottom: 1rem;
      }

      .settings-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }

      select {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        background-color: white;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="icon.svg"
        alt="Mouse Gestures"
        class="icon"
        width="90"
        height="90"
      />

      <p class="lead">Navigate with simple mouse gestures:</p>
      <ul class="list">
        <li><strong>Go Forward:</strong> Draw right (R)</li>
        <li><strong>Go Back:</strong> Draw left (L)</li>
        <li><strong>Close Tab:</strong> Draw down-right (DR)</li>
        <li><strong>Reopen Tab:</strong> Draw up-right (UR)</li>
      </ul>

      <div class="settings">
        <div class="settings-group">
          <label for="activationKey"
            >Activation Button (which mouse button starts a gesture):</label
          >
          <select id="activationKey">
            <option value="1">Middle Mouse Button (recommended)</option>
            <option value="2" selected>
              Right Mouse Button (may interfere with some sites)
            </option>
            <option value="3">Mouse Button 4 (side button)</option>
            <option value="4">Mouse Button 5 (side button)</option>
          </select>
          <p
            class="lead"
            style="margin-top: 0.5rem; font-size: 0.8rem; color: #555"
          >
            If some web apps break, try using the middle mouse button or a side
            button instead.
          </p>
        </div>

        <div class="settings-group">
          <label for="sensitivity"
            >Gesture Sensitivity (how easily movement is tracked):</label
          >
          <select id="sensitivity">
            <option value="1">1 – Least sensitive (needs more movement)</option>
            <option value="2">2</option>
            <option value="3" selected>3 – Balanced</option>
            <option value="4">4</option>
            <option value="5">
              5 – Most sensitive (small movements count)
            </option>
          </select>
        </div>

        <div class="settings-group">
          <label for="tolerance"
            >Gesture Tolerance (how big a gesture must be):</label
          >
          <select id="tolerance">
            <option value="1">1 – Small gestures are enough</option>
            <option value="2">2</option>
            <option value="3" selected>3 – Balanced</option>
            <option value="4">4</option>
            <option value="5">5 – Requires large, deliberate gestures</option>
          </select>
        </div>
      </div>

      <footer>
        <a
          href="https://github.com/antnsn/chromeGestures"
          target="_blank"
          rel="noopener noreferrer"
          class="button"
        >
          View on GitHub
        </a>
      </footer>
    </div>

    <!-- Load external script file -->
    <script src="popup.js"></script>
  </body>
</html>

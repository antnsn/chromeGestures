<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Modern gradient background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E3192"/>
      <stop offset="100%" style="stop-color:#1BFFFF"/>
    </linearGradient>
    
    <!-- Gesture path gradient -->
    <linearGradient id="path-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF416C"/>
      <stop offset="100%" style="stop-color:#FF4B2B"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle with modern gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-gradient)">
    <!-- Subtle rotation animation -->
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 64 64"
      to="360 64 64"
      dur="60s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Elegant cursor symbol -->
  <path d="M40 30 L40 70 L50 60 L60 80 L67 77 L57 57 L70 57 Z" 
        fill="white" 
        opacity="0.9"
        filter="url(#glow)">
    <!-- Subtle pulse animation -->
    <animate
      attributeName="opacity"
      values="0.9;0.7;0.9"
      dur="2s"
      repeatCount="indefinite"/>
  </path>

  <!-- Dynamic gesture path -->
  <path d="M40 70 Q60 70, 70 85 T100 70" 
        fill="none"
        stroke="url(#path-gradient)"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"
        opacity="0.9">
    <!-- Dash animation -->
    <animate
      attributeName="stroke-dasharray"
      values="0,150;150,0"
      dur="2s"
      repeatCount="indefinite"/>
  </path>

  <!-- Decorative particles -->
  <g opacity="0.8">
    <circle cx="40" cy="70" r="3" fill="white">
      <animate
        attributeName="r"
        values="3;4;3"
        dur="1s"
        repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="85" r="3" fill="white">
      <animate
        attributeName="r"
        values="3;4;3"
        dur="1s"
        repeatCount="indefinite"
        begin="0.3s"/>
    </circle>
    <circle cx="100" cy="70" r="3" fill="white">
      <animate
        attributeName="r"
        values="3;4;3"
        dur="1s"
        repeatCount="indefinite"
        begin="0.6s"/>
    </circle>
  </g>
</svg>